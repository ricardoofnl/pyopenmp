[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyopenmp"
version = "0.1.0"
description = "Write open.mp gamemodes in Python."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MPL-2.0" }
authors = [{ name = "pyopenmp contributors" }]

[project.urls]
Repository = "https://github.com/ricardoofnl/pyopenmp"

[tool.setuptools]
packages = ["pyopenmp", "pyopenmp.generated", "pyopenmp.generated.natives"]

[tool.setuptools.package-data]
pyopenmp = ["py.typed"]
